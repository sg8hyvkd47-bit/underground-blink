<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Underground Blink — test sprite</title><style>*{box-sizing:border-box}html,body{margin:0;background:#020608;color:white;font-family:Arial;overflow:hidden;touch-action:none}canvas{width:100vw;height:100dvh;display:block}#ui{position:absolute;inset:0;pointer-events:none}button{pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;border:2px solid #79d8b9;background:#061d20d9;color:#e7fff8;font-weight:bold;border-radius:50%;font-size:clamp(13px,2vw,19px);width:clamp(52px,9vw,82px);height:clamp(52px,9vw,82px)}#left{position:absolute;left:2%;bottom:8%;display:flex;gap:12px}#right{position:absolute;right:2%;bottom:8%;display:flex;gap:10px}#right button{border-color:#e8b95a}#title{position:absolute;top:12px;left:18px;font-weight:bold;text-shadow:0 2px 6px black;font-size:clamp(13px,2.1vw,24px)}#info{position:absolute;top:44px;left:18px;font-size:13px;color:#d6ffe7;text-shadow:0 2px 5px black}#restart{position:absolute;top:10px;right:12px;width:auto;height:auto;border-radius:10px;padding:9px;font-size:13px}#rotate{display:none}@media (orientation:portrait){#rotate{display:block;position:absolute;left:0;right:0;top:46%;text-align:center;background:#001b1bde;padding:14px;font-weight:bold}}</style></head><body><canvas id="c"></canvas><div id="ui"><div id="title">BAZÙ GAMES · UNDERGROUND BLINK</div><div id="info">TEST SPRITE · corsa, salto, pugno · frecce o A/D, spazio, J</div><button id="restart">RICOMINCIA</button><div id="left"><button data-key="left">◀</button><button data-key="right">▶</button></div><div id="right"><button data-key="jump">SALTO</button><button data-key="punch">PUGNO</button></div><div id="rotate">Ruota il telefono in orizzontale ↻</div></div><script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W=1280,H=720;cv.width=W;cv.height=H;
const assets={};for(let name of ['kane','thug']){assets[name]=[];let n=name==='kane'?16:12;for(let i=0;i<n;i++){let im=new Image();im.src=name+i+'.png';assets[name].push(im)}}let bg=new Image();bg.src='metro.jpg';
let keys=new Set(),hero={x:130,y:0,vy:0,face:1,attack:0,step:0},enemy={x:840,hit:0},camera=0,score=0,last=performance.now();const ground=568;
function reset(){hero={x:130,y:ground,vy:0,face:1,attack:0,step:0};enemy={x:840,hit:0};camera=0;score=0}reset();document.getElementById('restart').onclick=reset;
function key(e){let k=e.key.toLowerCase();return k==='arrowleft'||k==='a'?'left':k==='arrowright'||k==='d'?'right':k===' '||k==='arrowup'||k==='w'?'jump':k==='j'||k==='k'?'punch':null}window.addEventListener('keydown',e=>{let k=key(e);if(k){e.preventDefault();keys.add(k)}});window.addEventListener('keyup',e=>{let k=key(e);if(k)keys.delete(k)});window.addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});for(let t of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(t,()=>keys.delete(k))});
function sprite(im,x,y,w,h,flip=false){if(!im?.complete||!im.naturalWidth)return;ctx.save();if(flip){ctx.translate(x+w,y);ctx.scale(-1,1);ctx.drawImage(im,0,0,w,h)}else ctx.drawImage(im,x,y,w,h);ctx.restore()}
function draw(t){let dt=Math.min(.04,(t-last)/1000);last=t;let dir=(keys.has('right')?1:0)-(keys.has('left')?1:0);hero.x=Math.max(40,Math.min(2600,hero.x+dir*290*dt));if(dir)hero.face=dir;if(keys.has('jump')&&hero.y>=ground){hero.vy=-730;hero.y=ground-1}hero.vy+=1800*dt;hero.y=Math.min(ground,hero.y+hero.vy*dt);if(hero.y===ground)hero.vy=0;hero.attack=Math.max(0,hero.attack-dt);if(keys.has('punch')&&hero.attack<=0){hero.attack=.37;if(Math.abs(hero.x-enemy.x)<135&&Math.sign(enemy.x-hero.x)===hero.face){enemy.hit=.55;score+=100}}enemy.hit=Math.max(0,enemy.hit-dt);hero.step+=Math.abs(dir)*dt*10;camera+=(Math.max(0,hero.x-340)-camera)*Math.min(1,dt*5);
ctx.clearRect(0,0,W,H);ctx.fillStyle='#001b18';ctx.fillRect(0,0,W,H);if(bg.complete&&bg.naturalWidth){let bw=1020;for(let i=-1;i<5;i++){let px=i*bw-camera*.23%bw;ctx.drawImage(bg,px,0,bw,720)}}ctx.fillStyle='#000b0d70';ctx.fillRect(0,490,W,230);ctx.fillStyle='#0c2528bb';ctx.fillRect(0,ground+8,W,150);ctx.strokeStyle='#72d6bc55';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,ground+9);ctx.lineTo(W,ground+9);ctx.stroke();
let hx=hero.x-camera;let jumping=hero.y<ground-5;let idx=hero.attack>0?(hero.attack>.19?12:13):jumping?(hero.vy<0?9:10):dir?4+Math.floor(hero.step)%4:Math.floor(t/350)%3; sprite(assets.kane[idx],hx-42,hero.y-162,98,164,hero.face<0);
let ex=enemy.x-camera;sprite(assets.thug[enemy.hit>0?10:Math.floor(t/440)%3],ex-44,ground-157,103,160,true);if(enemy.hit>0){ctx.fillStyle='#ffe46c';ctx.font='bold 25px Arial';ctx.fillText('HIT!',ex-20,ground-190)}ctx.fillStyle='#b6ffe3';ctx.font='bold 23px monospace';ctx.fillText('PUNTI '+String(score).padStart(6,'0'),W-260,38);ctx.fillStyle='#061d1ce8';ctx.fillRect(18,78,222,17);ctx.fillStyle='#19e39e';ctx.fillRect(20,80,218,13);requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
