<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>UNDERGROUND BLINK · BAZÙ GAMES</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030807;color:#b8ffe1;font-family:Arial,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh;object-fit:contain;background:#030807}#overlay{position:absolute;inset:0;background:#010706d9;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:22px;z-index:4}h1{font-size:clamp(28px,6vw,70px);letter-spacing:.12em;text-shadow:0 0 24px #24f5a4;margin:12px}#story{max-width:700px;font-size:clamp(16px,2.4vw,27px);line-height:1.4;min-height:85px}button{background:#102e26;border:2px solid #5ef8b3;color:#c4ffe2;padding:12px 22px;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer}#start{margin-top:18px}#hud{position:absolute;top:9px;left:14px;right:14px;display:none;justify-content:space-between;gap:12px;font-size:clamp(12px,2vw,18px);text-shadow:0 1px 4px #000;pointer-events:none}#controls{position:absolute;bottom:12px;left:12px;right:12px;display:none;justify-content:space-between;pointer-events:none}#controls .group{display:flex;gap:10px}#controls button{pointer-events:auto;min-width:65px;height:60px;background:#09241fd6;font-size:16px;user-select:none}#pause{position:absolute;top:45px;right:12px;display:none;font-size:13px;padding:8px;z-index:3}@media(max-height:430px){#controls button{height:48px;min-width:58px}#pause{top:35px}}</style></head><body><canvas id="game" width="960" height="540"></canvas><div id="overlay"><div id="brand">BAZÙ GAMES PRESENTA</div><h1>UNDERGROUND<br>BLINK</h1><div id="story">NEON CITY, 1999.<br>La Linea Zero è scomparsa dalle mappe.<br>Kane deve raggiungere il cuore di BLINK.</div><button id="start">GIOCA / SALTA INTRO</button></div><div id="hud"><span id="level">FERMATA 1 · ULTIMA FERMATA</span><span id="stats">PUNTI 0000 · VITE 3</span></div><button id="pause">PAUSA / SALVA</button><div id="controls"><div class="group"><button data-key="left">◀</button><button data-key="right">▶</button></div><div class="group"><button data-key="slide">SCIVOLA</button><button data-key="attack">PUGNO</button><button data-key="jump">SALTA</button></div></div><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),W=960,H=540;const bg=new Image();bg.src='metro.png';const overlay=document.querySelector('#overlay'),hud=document.querySelector('#hud'),controls=document.querySelector('#controls'),pause=document.querySelector('#pause');let state='intro',last=0,world=0,score=0,lives=3,level=0,inv=0,attack=0,slide=0;const keys={};const themes=[['ULTIMA FERMATA','#19e99b'],['TUNNEL 13','#4e9dff'],['DEPOSITO','#ff4f63'],['SETTORE PROIBITO','#ffcc43'],['LINEA ZERO','#d7f9ff']];let hero={x:110,y:405,vy:0,ground:405,face:1,run:0};let enemies=[];const checkpoint=()=>{try{localStorage.setItem('blink_save',JSON.stringify({level,score,lives}))}catch(e){}};function resetEnemies(){enemies=Array.from({length:12},(_,i)=>({x:650+i*340,y:405,hp:i%4===0?3:2,hit:0,dir:-1}));}function startGame(continueGame=false){if(continueGame){try{const s=JSON.parse(localStorage.getItem('blink_save'));if(s){level=s.level||0;score=s.score||0;lives=s.lives||3}}catch(e){}}else{level=0;score=0;lives=3;}world=0;hero.x=110;hero.y=405;hero.vy=0;resetEnemies();state='play';overlay.style.display='none';hud.style.display='flex';controls.style.display='flex';pause.style.display='block';}document.querySelector('#start').onclick=()=>startGame(!!localStorage.getItem('blink_save')&&document.querySelector('#start').textContent.includes('CONTINUA'));if(localStorage.getItem('blink_save'))document.querySelector('#start').textContent='CONTINUA PARTITA';pause.onclick=()=>{if(state==='play'){state='pause';checkpoint();overlay.style.display='flex';document.querySelector('#story').innerHTML='Partita salvata al checkpoint.<br>Premi RIPRENDI per continuare.';document.querySelector('#start').textContent='RIPRENDI';document.querySelector('#start').onclick=()=>{state='play';overlay.style.display='none'};}else if(state==='pause'){state='play';overlay.style.display='none'}};document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',()=>keys[k]=false);b.addEventListener('pointercancel',()=>keys[k]=false)});const keyMap={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',Space:'jump',KeyZ:'attack',ArrowDown:'slide',KeyX:'slide'};window.addEventListener('keydown',e=>{if(keyMap[e.code]){keys[keyMap[e.code]]=true;e.preventDefault()}});window.addEventListener('keyup',e=>{if(keyMap[e.code])keys[keyMap[e.code]]=false});function drawActor(x,y,enemy=false,t=0,face=1,att=false,sl=false){ctx.save();ctx.translate(x,y);ctx.scale(face,1);if(sl){ctx.scale(1,.67);ctx.translate(0,28)}let sway=Math.sin(t)*6;ctx.fillStyle='#050b0c';ctx.strokeStyle=enemy?'#b7404c':'#365b55';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-12,-56);ctx.lineTo(-19,-2);ctx.lineTo(3,-8);ctx.lineTo(19,-2);ctx.lineTo(12,-56);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle='#0b1316';ctx.lineWidth=11;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-7,-12);ctx.lineTo(-8+sway,0);ctx.moveTo(7,-12);ctx.lineTo(8-sway,0);ctx.stroke();ctx.fillStyle=enemy?'#4a2529':'#111a1b';ctx.fillRect(-14,-77,28,29);ctx.strokeStyle=enemy?'#d85e62':'#6e9187';ctx.lineWidth=3;ctx.strokeRect(-14,-77,28,29);ctx.strokeStyle='#111c1d';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(-12,-70);ctx.lineTo(-19,-42+sway/2);ctx.moveTo(12,-70);ctx.lineTo(att?37:19,-50);ctx.stroke();ctx.fillStyle=enemy?'#a15c5d':'#c4a18b';ctx.beginPath();ctx.ellipse(0,-89,12,14,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#070d0e';ctx.fillRect(-12,-94,24,6);ctx.fillRect(-12,-103,24,8);ctx.fillStyle=enemy?'#ff6868':'#54f0b5';ctx.fillRect(1,-93,10,2);ctx.restore()};function draw(){ctx.clearRect(0,0,W,H);let tint=themes[level][1];ctx.fillStyle='#020907';ctx.fillRect(0,0,W,H);if(bg.complete&&bg.naturalWidth){let w=1240;for(let i=-1;i<5;i++){let bx=i*w-(world*.42%w);ctx.drawImage(bg,bx,-60,w,560)}}ctx.fillStyle=tint+'20';ctx.fillRect(0,0,W,H);ctx.fillStyle='#030a0a99';ctx.fillRect(0,435,W,105);ctx.fillStyle=tint;ctx.globalAlpha=.65;ctx.fillRect(0,434,W,3);ctx.globalAlpha=1;for(let i=0;i<12;i++){let x=i*180-world*.85%180;ctx.fillStyle='#0c1517';ctx.fillRect(x,441,10,100);ctx.fillStyle=tint+'25';ctx.fillRect(x+10,450,50,2)}enemies.forEach(e=>{if(e.hp<=0)return;let sx=e.x-world;if(sx>-50&&sx<1000){drawActor(sx,e.y,true,performance.now()*.006,-1);if(e.hp===3){ctx.fillStyle='#f55';ctx.fillRect(sx-12,e.y-114,24,3)}}});if(inv<=0||Math.floor(inv/7)%2===0)drawActor(hero.x,hero.y,false,hero.run,hero.face,attack>0,slide>0);ctx.fillStyle=tint;ctx.font='bold 20px Arial';ctx.fillText('BAZÙ // BLINK',22,35);ctx.font='15px Arial';ctx.fillText('Demo tecnica · fondale panoramico fotografico',22,58);}
function tick(ts){let dt=Math.min((ts-last)/16.67||1,2);last=ts;if(state==='play'){let speed=(3.3+level*.4)*dt,moving=false;if(keys.right){world+=speed;hero.face=1;moving=true}if(keys.left){world=Math.max(0,world-speed);hero.face=-1;moving=true}if(moving)hero.run+=dt*.26;if(keys.jump&&hero.y>=hero.ground)hero.vy=-13;if(keys.attack&&attack<=0)attack=16;if(keys.slide&&slide<=0)slide=23;hero.vy+=.68*dt;hero.y=Math.min(hero.ground,hero.y+hero.vy*dt);attack=Math.max(0,attack-dt);slide=Math.max(0,slide-dt);inv=Math.max(0,inv-dt);enemies.forEach(e=>{if(e.hp<=0)return;let d=e.x-world-hero.x;if(Math.abs(d)<60&&attack>8&&attack<16&&hero.y>365){e.hp=0;score+=100;return}if(Math.abs(d)<24&&hero.y>360&&inv<=0){score=Math.max(0,score-50);lives--;inv=75;if(lives<=0){state='pause';checkpoint();overlay.style.display='flex';document.querySelector('#story').textContent='Partita terminata. Punteggio: '+score;document.querySelector('#start').textContent='RICOMINCIA';document.querySelector('#start').onclick=()=>startGame(false)}}});if(world>4400){level=(level+1)%5;world=0;resetEnemies();score+=500;checkpoint()}document.querySelector('#level').textContent=`FERMATA ${level+1} · ${themes[level][0]}`;document.querySelector('#stats').textContent=`PUNTI ${String(score).padStart(4,'0')} · VITE ${lives}`;}draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
