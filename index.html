<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>UNDERGROUND BLINK · Test V3</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#01080b;color:#fff;font-family:Arial,sans-serif;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#ui{position:fixed;inset:0;pointer-events:none}button{pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;background:#05181bcf;color:#fff;border:2px solid #71f1c4;border-radius:50%;width:clamp(56px,9vw,86px);height:clamp(56px,9vw,86px);font-weight:800;font-size:clamp(13px,2vw,19px)}#move{position:absolute;bottom:6%;left:3%;display:flex;gap:12px}#actions{position:absolute;bottom:6%;right:3%;display:flex;gap:12px}#actions button{border-color:#ffd27a}#top{position:absolute;left:14px;top:8px;font-size:clamp(12px,2vw,19px);font-weight:900;text-shadow:0 2px 6px black}#restart{position:absolute;right:12px;top:9px;border-radius:12px;width:auto;height:auto;padding:10px;font-size:13px}#rotate{display:none}@media(orientation:portrait){#rotate{display:block;position:absolute;inset:35% 0 auto;background:#001e20ed;text-align:center;padding:18px;font-weight:800}}</style></head><body><canvas id="c" width="1280" height="720"></canvas><div id="ui"><div id="top">BAZÙ GAMES · UNDERGROUND BLINK <span style="color:#8ef9cc">V3</span></div><button id="restart">RICOMINCIA</button><div id="move"><button data-key="left">◀</button><button data-key="right">▶</button></div><div id="actions"><button data-key="jump">SALTO</button><button data-key="punch">PUGNO</button></div><div id="rotate">Ruota il telefono in orizzontale ↻</div></div><script>
const cv=document.querySelector('canvas'),ctx=cv.getContext('2d'),W=1280,H=720,ground=570;const imgs={};for(const [name,count] of [['kane',16],['thug',12]]){imgs[name]=Array.from({length:count},(_,i)=>{const x=new Image();x.src=name+i+'.png';return x})}const stations=Array.from({length:3},(_,i)=>{const x=new Image();x.src='station'+i+'.jpg';return x});const keys=new Set();let hero,enemies,camera,score,last=performance.now(),punchWas=false;
function reset(){hero={x:180,y:ground,vy:0,face:1,step:0,attack:0,attackId:0,hp:100};enemies=[{x:660,hp:3,hit:0,knock:0},{x:1400,hp:3,hit:0,knock:0},{x:2300,hp:3,hit:0,knock:0},{x:3300,hp:3,hit:0,knock:0}];camera=0;score=0;keys.clear();punchWas=false}reset();document.getElementById('restart').onclick=reset;
function norm(k){k=k.toLowerCase();return ['arrowleft','a'].includes(k)?'left':['arrowright','d'].includes(k)?'right':['arrowup','w',' '].includes(k)?'jump':['j','k'].includes(k)?'punch':null}window.addEventListener('keydown',e=>{const k=norm(e.key);if(k){e.preventDefault();keys.add(k)}});window.addEventListener('keyup',e=>{const k=norm(e.key);if(k)keys.delete(k)});window.addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k))});
function spr(im,x,y,w,h,flip){if(!im?.complete||!im.naturalWidth)return;ctx.save();if(flip){ctx.translate(x+w,y);ctx.scale(-1,1);ctx.drawImage(im,0,0,w,h)}else ctx.drawImage(im,x,y,w,h);ctx.restore()}
function frame(t){const dt=Math.min(.04,(t-last)/1000);last=t;const dir=(keys.has('right')?1:0)-(keys.has('left')?1:0);hero.x=Math.max(65,Math.min(4100,hero.x+dir*310*dt));if(dir)hero.face=dir;if(keys.has('jump')&&hero.y>=ground){hero.vy=-750;hero.y-=2}hero.vy+=1800*dt;hero.y=Math.min(ground,hero.y+hero.vy*dt);if(hero.y===ground)hero.vy=0;hero.step+=Math.abs(dir)*dt*11;
hero.attack=Math.max(0,hero.attack-dt);if(keys.has('punch')&&!punchWas&&hero.attack===0){hero.attack=.34;hero.attackId++;for(const e of enemies){if(e.hp<=0)continue;const dx=e.x-hero.x;if(dx*hero.face>0&&dx*hero.face<165&&Math.abs(hero.y-ground)<75){e.hp--;e.hit=.34;e.knock=hero.face*55;score+=100;break}}}punchWas=keys.has('punch');for(const e of enemies){e.hit=Math.max(0,e.hit-dt);if(e.knock){let m=Math.sign(e.knock)*Math.min(Math.abs(e.knock),270*dt);e.x+=m;e.knock-=m}}
camera+=(Math.max(0,hero.x-300)-camera)*Math.min(1,dt*6);ctx.clearRect(0,0,W,H);ctx.fillStyle='#01100f';ctx.fillRect(0,0,W,H);
// Distinct adjacent photographic panels, not a repeated whole-screen image.
const panelW=1400;for(let i=0;i<4;i++){let im=stations[i%3];if(im.complete&&im.naturalWidth)ctx.drawImage(im,i*panelW-camera,0,panelW,720)}
ctx.fillStyle='#001a1d55';ctx.fillRect(0,560,W,160);ctx.strokeStyle='#62d5bd77';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,ground+12);ctx.lineTo(W,ground+12);ctx.stroke();
for(const e of enemies){if(e.hp<=0)continue;const x=e.x-camera;if(x< -120||x>W+120)continue;const index=e.hit>0?10:Math.floor(t/400)%3;spr(imgs.thug[index],x-53,ground-160,106,160,true);if(e.hit>0){ctx.fillStyle='#fff0a0';ctx.font='bold 26px Arial';ctx.fillText('HIT!',x-20,ground-190);ctx.fillStyle='#ffcb4e';ctx.fillRect(x-30,ground-180,60*e.hp/3,5)}}
const hx=hero.x-camera;const jumping=hero.y<ground-6;const index=hero.attack>0?(hero.attack>.17?13:14):jumping?(hero.vy<0?9:10):dir?4+Math.floor(hero.step)%4:Math.floor(t/370)%3;spr(imgs.kane[index],hx-51,hero.y-170,106,170,hero.face<0);
if(hero.attack>.08&&hero.attack<.24){const ix=hx+hero.face*75;ctx.fillStyle='#ffe89b';ctx.beginPath();ctx.arc(ix,hero.y-110,9,0,Math.PI*2);ctx.fill()}
ctx.fillStyle='#00191de0';ctx.fillRect(10,39,230,22);ctx.fillStyle='#17d79d';ctx.fillRect(13,42,224*hero.hp/100,16);ctx.font='bold 22px monospace';ctx.fillStyle='#f2fff9';ctx.fillText('PUNTI '+String(score).padStart(6,'0'),W-270,42);ctx.font='bold 15px Arial';ctx.fillText('FERMATA 1 · BINARIO SUD',W/2-115,43);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
